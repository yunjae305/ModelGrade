  var secs = ids.map(function (id) { return document.getElementById(id); });
  var links = Array.prototype.slice.call(document.querySelectorAll('#toc-links a'));
  function current() {
    var y = window.scrollY + window.innerHeight * 0.3, idx = 0;
    secs.forEach(function (s, i) { if (s.offsetTop <= y) idx = i; });
