name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    # 개발 환경은 Windows — Windows 결과가 기준이고, Linux 는 이식성 확인용(실패해도 PR 을 막지 않음)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: "3.12"
            required: true
          - os: ubuntu-latest
            python: "3.12"
            required: false
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ !matrix.required }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: 한글 글꼴(Linux) — 질문 첨부 PDF 만들기 시험용
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-nanum
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Test (모델 호출 없음 — 가짜 심판)
        env:
          PYTHONUTF8: "1"
        run: python -m pytest -q
      - name: 기준 재확인 (문서 · 프롬프트 · 코드가 같은 말을 하는지)
        env:
          PYTHONUTF8: "1"
        run: python -X utf8 tools/criteria_consistency.py

  install-script:
    # 다른 PC 에서 처음 설치하는 그대로 — Linux · macOS 는 bash install.sh, Windows 는 install.ps1. Codex 설치는 건너뜀(로그인이 필요해서)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      MODELGRADE_SKIP_CODEX: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 설치 (Linux · macOS)
        if: runner.os != 'Windows'
        run: bash install.sh
      - name: 설치 (Windows PowerShell)
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\install.ps1
      - name: 실행 래퍼 · 점검 (Linux · macOS)
        if: runner.os != 'Windows'
        run: |
          ./modelgrade.sh --help
          ./modelgrade.sh doctor || true
      - name: 실행 래퍼 · 점검 (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .\modelgrade --help
          .\modelgrade doctor; exit 0

